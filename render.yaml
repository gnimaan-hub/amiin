services:
  - type: web
    name: amiin-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free

    # Variables d'environnement — valeurs à remplir dans le dashboard Render
    # Dashboard → amiin-api → Environment → Add Environment Variable
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false          # valeur saisie manuellement dans Render (jamais dans le code)
      - key: JINA_API_KEY
        sync: false
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: OWM_API_KEY
        sync: false
      - key: GROQ_API_KEY        # STT Whisper (Groq, gratuit) — reconnaissance vocale somali
        sync: false
      - key: DATABASE_URL          # ← NOUVEAU
        sync: false
      - key: JWT_SECRET_KEY        # OBLIGATOIRE — l'API refuse de démarrer sans (openssl rand -hex 32)
        sync: false
      - key: LOG_SECRET            # OBLIGATOIRE pour consulter /v1/logs (en-tête X-Log-Secret, sinon endpoint fermé)
        sync: false
      # - key: LOG_QUERY_TEXT      # optionnel — "1" pour journaliser le texte des questions (diagnostic ponctuel)
      # Comptes administrateurs : e-mails séparés par des virgules. Adresse réputée
      # vérifiée, aucune limite d'usage. Retirer un e-mail le repasse en utilisateur.
      - key: ADMIN_EMAILS
        sync: false
      # Vérification d'e-mail à l'inscription (code à 6 chiffres) : "required" ou "off".
      # Par défaut : exigée dès qu'un envoi d'e-mails est configuré (ci-dessous).
      # - key: EMAIL_VERIFICATION
      # Envoi d'e-mails (codes de vérification et mot de passe oublié). Sans envoi
      # configuré, /auth/forgot-password répond 503 et la vérification est désactivée.
      # Recommandé : BREVO_API_KEY (API HTTP, pas de port SMTP) + SMTP_FROM.
      - key: BREVO_API_KEY
        sync: false
      - key: SMTP_HOST             # alternative SMTP, ex. smtp-relay.brevo.com
        sync: false
      - key: SMTP_PORT             # 587 (STARTTLS) ou 465 (SSL)
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM             # expéditeur (requis dans les deux cas), ex. Amiin <no-reply@amiin.dj>
        sync: false
      # - key: CORS_ORIGINS        # optionnel — origines web autorisées, séparées par des virgules

      # Quota quotidien (usage.py) : enveloppe gratuite en dollars, chat + voix,
      # remise à zéro à minuit heure de Djibouti. Défaut : 0.10 (phase de tests).
      # - key: QUOTA_DAILY_USD       # ex. 0.02 en production
      # - key: QUOTA_ENFORCE         # "0" = mesure seulement, personne n'est bloqué
      # - key: QUOTA_KEY_SECRET      # secret du hachage des adresses (défaut : JWT_SECRET_KEY) — ne jamais changer
      # Modèles : CLAUDE_MODEL (défaut claude-haiku-5-5, français/anglais), CLAUDE_MODEL_AR,
      #           CLAUDE_EXPAND_MODEL — pour revenir à Haiku 4.5 : claude-haiku-4-5-20251001
      # Tarifs de la voix (optionnels) : STT_USD_PER_HOUR (0.111), STT_MIN_SECONDS (10),
      # TTS_USD_PER_MILLION_CHARS (4.0), JINA_USD_PER_MILLION (0.05)

      # Play Integrity (integrity.py) : vérifie à l'inscription et à la connexion que la
      # requête vient de l'app officielle du Play Store, sur un appareil intègre.
      # INTEGRITY_MODE : off (défaut) → report (mesure sans bloquer) → enforce (bloque).
      # - key: INTEGRITY_MODE
      - key: PLAY_INTEGRITY_SA_JSON   # contenu JSON de la clé du compte de service Google Cloud
        sync: false
      # - key: PLAY_INTEGRITY_PACKAGE  # défaut dj.amiin.app

    # Health check — Render surveille cet endpoint pour savoir si le service est vivant
    healthCheckPath: /v1/chat/health
