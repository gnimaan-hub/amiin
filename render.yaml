services:
  - type: web
    name: amiin-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free

    # Variables d'environnement — valeurs à remplir dans le dashboard Render
    # Dashboard → amiin-api → Environment → Add Environment Variable
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false          # valeur saisie manuellement dans Render (jamais dans le code)
      - key: JINA_API_KEY
        sync: false
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: OWM_API_KEY
        sync: false
      - key: GROQ_API_KEY        # STT Whisper (Groq, gratuit) — reconnaissance vocale somali
        sync: false
      - key: DATABASE_URL          # ← NOUVEAU
        sync: false
      - key: JWT_SECRET_KEY        # OBLIGATOIRE — l'API refuse de démarrer sans (openssl rand -hex 32)
        sync: false
      - key: LOG_SECRET            # OBLIGATOIRE pour consulter /v1/logs (en-tête X-Log-Secret, sinon endpoint fermé)
        sync: false
      # - key: LOG_QUERY_TEXT      # optionnel — "1" pour journaliser le texte des questions (diagnostic ponctuel)
      # Mot de passe oublié (code par e-mail) — sans SMTP_HOST/SMTP_FROM, /auth/forgot-password répond 503
      - key: SMTP_HOST             # ex. smtp-relay.brevo.com
        sync: false
      - key: SMTP_PORT             # 587 (STARTTLS) ou 465 (SSL)
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM             # ex. Amiin <no-reply@amiin.dj>
        sync: false
      # - key: CORS_ORIGINS        # optionnel — origines web autorisées, séparées par des virgules

    # Health check — Render surveille cet endpoint pour savoir si le service est vivant
    healthCheckPath: /v1/chat/health
