services:
  - type: web
    name: amiin-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free

    # Variables d'environnement — valeurs à remplir dans le dashboard Render
    # Dashboard → amiin-api → Environment → Add Environment Variable
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false          # valeur saisie manuellement dans Render (jamais dans le code)
      - key: JINA_API_KEY
        sync: false
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: OWM_API_KEY
        sync: false
      - key: GROQ_API_KEY        # STT Whisper (Groq, gratuit) — reconnaissance vocale somali
        sync: false
      - key: DATABASE_URL          # ← NOUVEAU
        sync: false
      - key: JWT_SECRET_KEY        # OBLIGATOIRE — l'API refuse de démarrer sans (openssl rand -hex 32)
        sync: false
      - key: LOG_SECRET            # OBLIGATOIRE pour consulter /v1/logs (sinon endpoint fermé)
        sync: false
      # - key: CORS_ORIGINS        # optionnel — origines web autorisées, séparées par des virgules

    # Health check — Render surveille cet endpoint pour savoir si le service est vivant
    healthCheckPath: /v1/chat/health
