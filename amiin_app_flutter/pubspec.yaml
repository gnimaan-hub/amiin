name: amiin_app_flutter
description: "Amiin — Guide universel de Djibouti"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  go_router: ^17.0.0
  dio: ^5.9.2
  google_fonts: ^6.3.2
  intl: ^0.20.2
  geolocator: ^12.0.0
  url_launcher: ^6.2.5
  speech_to_text: ^7.3.0
  record: ^6.0.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  uuid: ^4.0.0
  flutter_tts: ^3.8.5
  flutter_svg: ^2.2.3
  flutter_markdown: ^0.7.7+1

  # Stockage sécurisé (clé de chiffrement Hive)
  flutter_secure_storage: ^9.2.2

  # State management
  provider: ^6.1.2

  # Notifications locales
  flutter_local_notifications: ^17.2.3
  timezone: ^0.9.4

  # Connectivité réseau
  connectivity_plus: ^6.1.1

  # Lecture audio (voix cloud Edge TTS)
  just_audio: ^0.9.46
  path_provider: ^2.1.4
  home_widget: ^0.9.3
  workmanager: ^0.9.0+3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  hive_generator: ^2.0.0
  build_runner: ^2.4.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.4

# Icône officielle : mark « A » crème sur fond Turquoise Tadjourah (variante
# turquoise-selassal). Android reçoit en plus l'icône adaptative (fond uni
# turquoise + mark crème) et l'icône thématisée monochrome (Android 13+).
# Régénérer : flutter test test/gen_splash_logo_test.dart
#          puis dart run flutter_launcher_icons
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/icon.png"
  min_sdk_android: 21
  remove_alpha_ios: true
  adaptive_icon_background: "#1E8A8A"
  adaptive_icon_foreground: "assets/icon/adaptive_foreground.png"
  adaptive_icon_monochrome: "assets/icon/adaptive_monochrome.png"
  web:
    generate: true
    image_path: "assets/icon/icon.png"
    background_color: "#1E8A8A"
    theme_color: "#1E8A8A"
  windows:
    generate: true
    image_path: "assets/icon/icon.png"
    icon_size: 48

# Écran de lancement NATIF : affiché par l'OS dès le tap sur l'icône, pendant
# que le moteur Flutter démarre. Même identité que le splash Flutter (fond
# Sel d'Assal + mark turquoise ; en sombre : Encre de Nuit + mark crème) pour
# une transition invisible, sans écran noir.
# Régénérer après modification : dart run flutter_native_splash:create
flutter_native_splash:
  color: "#F2EFE9"
  image: assets/splash/splash_logo.png
  color_dark: "#14213D"
  image_dark: assets/splash/splash_logo_dark.png
  android_12:
    color: "#F2EFE9"
    image: assets/splash/splash_logo.png
    color_dark: "#14213D"
    image_dark: assets/splash/splash_logo_dark.png
  # Le web a déjà son pré-loader personnalisé dans web/index.html
  web: false

flutter:
  uses-material-design: true

  assets:
    - assets/icon/
    - assets/logo/
    - assets/data/
