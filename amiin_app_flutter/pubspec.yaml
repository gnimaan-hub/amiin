name: amiin_app_flutter
description: "Amiin — Guide universel de Djibouti"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  go_router: ^17.0.0
  dio: ^5.9.2
  google_fonts: ^6.3.2
  intl: ^0.20.2
  geolocator: ^12.0.0
  url_launcher: ^6.2.5
  speech_to_text: ^7.3.0
  record: ^6.0.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  uuid: ^4.0.0
  flutter_tts: ^3.8.5
  flutter_svg: ^2.2.3
  flutter_markdown: ^0.7.7+1

  # Stockage sécurisé (clé de chiffrement Hive)
  flutter_secure_storage: ^9.2.2

  # State management
  provider: ^6.1.2

  # Notifications locales
  flutter_local_notifications: ^17.2.3
  timezone: ^0.9.4

  # Connectivité réseau
  connectivity_plus: ^6.1.1

  # Lecture audio (voix cloud Edge TTS)
  just_audio: ^0.9.46
  path_provider: ^2.1.4
  home_widget: ^0.9.3
  workmanager: ^0.9.0+3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  hive_generator: ^2.0.0
  build_runner: ^2.4.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/icon.png"
  min_sdk_android: 21
  remove_alpha_ios: true
  web:
    generate: true
    image_path: "assets/icon/icon.png"
  windows:
    generate: true
    image_path: "assets/icon/icon.png"
    icon_size: 48

flutter:
  uses-material-design: true

  assets:
    - assets/icon/
    - assets/data/
